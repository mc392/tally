<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<!-- Tally never talks to any server except the one it is loaded from. This rule makes the browser
     enforce that: no script, request or form can reach anywhere else, even by mistake. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tally">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Tally</title>
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg">
<style>
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --cell-hi:#E5E5EA; --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.22);
  --accent:#5856D6; --accent-tint:rgba(88,86,214,.12); --green:#248A3D; --red:#D70015; --orange:#C93400;
  --c-net:#1C1C1E; --c-isa:#5856D6; --c-cash:#0A84A8; --c-sav:#248A3D; --c-debt:#D70015;
  --bar:rgba(247,247,250,.82); --shadow:0 12px 40px rgba(0,0,0,.18);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000; --cell:#1C1C1E; --cell-hi:#2C2C2E; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.32);
  --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55);
  --accent:#7D7AFF; --accent-tint:rgba(125,122,255,.18); --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
  --c-net:#F2F2F7; --c-isa:#7D7AFF; --c-cash:#40C8E0; --c-sav:#30D158; --c-debt:#FF453A;
  --bar:rgba(22,22,24,.82); --shadow:0 12px 40px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#000; --cell:#1C1C1E; --cell-hi:#2C2C2E; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.32);
  --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55);
  --accent:#7D7AFF; --accent-tint:rgba(125,122,255,.18); --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
  --c-net:#F2F2F7; --c-isa:#7D7AFF; --c-cash:#40C8E0; --c-sav:#30D158; --c-debt:#FF453A;
  --bar:rgba(22,22,24,.82); --shadow:0 12px 40px rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%;}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--label); font:17px/1.29 var(--sans); letter-spacing:-.41px; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; letter-spacing:inherit}
input,select{font:inherit; letter-spacing:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* ---------- navigation bar ---------- */
.nav{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; height:44px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 8px; background:transparent; transition:background .2s, box-shadow .2s}
.nav.solid{background:var(--bar); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); box-shadow:0 .5px 0 var(--sep)}
.nav .t{font-weight:600; opacity:0; transition:opacity .15s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60vw}
.nav.solid .t{opacity:1}
.nav .l{justify-self:start; display:flex} .nav .r{justify-self:end; display:flex; gap:4px; align-items:center}
.back{color:var(--accent); display:flex; align-items:center; gap:2px; padding:8px 6px; font-size:17px}
.back svg{width:12px; height:20px}
.iconbtn{width:36px; height:36px; display:grid; place-items:center; color:var(--accent); border-radius:18px}
.iconbtn svg{width:22px; height:22px}
.row.dim .ttl, .row.dim .val{color:var(--label2)}
.warnchip{display:flex; gap:12px; align-items:flex-start; background:rgba(255,149,0,.12); color:var(--label); border-radius:12px; padding:12px 14px; margin:0 0 18px; font-size:14px; line-height:1.4}
.warnchip b{color:var(--orange)}
.warnchip button{margin-left:auto; flex:none; font:inherit; font-weight:600; color:var(--accent); background:none; border:0; padding:2px 4px}
.cmpwrap{overflow-x:auto; margin:0 -4px; -webkit-overflow-scrolling:touch}
.cmp{border-collapse:collapse; width:100%; font-size:14px; font-variant-numeric:tabular-nums}
.cmp th, .cmp td{padding:8px 6px; text-align:right; white-space:nowrap; border-bottom:.5px solid var(--sep)}
.cmp thead th{font-size:12px; color:var(--label2); font-weight:600}
.cmp tbody th{text-align:left; font-weight:400; color:var(--label2)}
.cmp td.best{color:var(--green); font-weight:600}
.cmp .sub{font-size:11px; color:var(--label2); font-weight:400}
.cmp tr.sec th{text-align:left; color:var(--label); font-weight:600; padding-top:14px}
.bar2{height:6px; border-radius:3px; background:var(--fill); margin-top:6px; position:relative; overflow:hidden}
.bar2 i{position:absolute; left:0; top:0; bottom:0; border-radius:3px; background:var(--accent)}
.bar2 i.over{background:var(--orange)}
.bar2 b{position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--label2)}
.catchip{font-size:12px; padding:2px 8px; border-radius:10px; background:var(--fill); color:var(--label2); white-space:nowrap}
.catchip.x{background:rgba(255,149,0,.16); color:var(--orange)}
.pill{font-size:13px; font-weight:600; padding:5px 10px; border-radius:14px; background:var(--fill); color:var(--label2); white-space:nowrap}
.pill.warn{background:rgba(255,149,0,.16); color:var(--orange)}
.pill.ok{color:var(--green); background:rgba(52,199,89,.14)}
.pill.bad{color:var(--red); background:rgba(255,59,48,.12)}

.page{max-width:640px; margin:0 auto; padding:0 16px 120px}
.page.push-in{animation:pushIn .32s cubic-bezier(.2,.8,.2,1)}
.page.pop-in{animation:popIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes pushIn{from{transform:translateX(28%); opacity:.3}to{transform:none; opacity:1}}
@keyframes popIn{from{transform:translateX(-14%); opacity:.4}to{transform:none; opacity:1}}
h1.large{font-size:34px; line-height:41px; font-weight:700; letter-spacing:.37px; margin:2px 4px 12px}
.subtitle{color:var(--label2); font-size:15px; margin:-8px 4px 16px}

/* ---------- grouped lists ---------- */
.group{margin:0 0 30px}
.gh{font-size:13px; color:var(--label2); margin:0 16px 7px; display:flex; justify-content:space-between; letter-spacing:-.08px}
.gh b{font-weight:400; color:var(--label2)}
.gf{font-size:13px; color:var(--label2); margin:7px 16px 0; line-height:1.38; letter-spacing:-.08px}
.list{background:var(--cell); border-radius:12px; overflow:hidden}
.row{display:flex; align-items:center; gap:12px; min-height:44px; padding:0 16px; position:relative; width:100%; text-align:left}
.row + .row::before, .row + .rowwrap::before, .rowwrap + .row::before{content:""; position:absolute; top:0; right:0; left:16px; height:.5px; background:var(--sep)}
.row.ic + .row::before, .row + .row.ic::before{left:58px}
button.row:active, .row.tap:active{background:var(--cell-hi)}
.row .main{flex:1; min-width:0; padding:11px 0}
.row .ttl{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .sub{font-size:13px; color:var(--label2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.08px}
.row .val{text-align:right; color:var(--label2); white-space:nowrap; font-variant-numeric:tabular-nums}
.row .val.strong{color:var(--label)}
.row .val .sub{text-align:right}
.chev{width:8px; height:14px; color:var(--label3); flex:none}
.gicon{width:30px; height:30px; border-radius:7px; display:grid; place-items:center; flex:none; color:#fff}
.gicon svg{width:18px; height:18px}
.act-row{color:var(--accent)}
.act-row.danger{color:var(--red)}
.tag{font-size:11px; font-weight:600; letter-spacing:.06px; padding:2px 6px; border-radius:5px; background:var(--fill); color:var(--label2); margin-left:6px; vertical-align:1px}
.up{color:var(--green)} .down{color:var(--red)}
.neg{color:var(--red)}

/* ---------- hero ---------- */
.hero{margin:6px 4px 22px}
.hero .cap{font-size:15px; color:var(--label2); display:flex; gap:8px; align-items:center}
.hero .big{font-family:var(--round); font-weight:700; font-size:52px; line-height:1.05; letter-spacing:-1.2px; margin:4px 0 8px; font-variant-numeric:tabular-nums}
.hero .big .p{font-size:.52em; letter-spacing:-.4px; vertical-align:.62em; margin-right:2px; font-weight:600}
.hero .chg{font-size:15px; font-weight:600; font-variant-numeric:tabular-nums}
.hero .chg > span:not(.amt){font-weight:400; color:var(--label2)}
.hero .eq{font-size:15px; color:var(--label2); margin-top:4px}

.cta{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:50px; border-radius:14px; background:var(--accent); color:#fff; font-weight:600; margin:0 0 28px}
.cta:active{filter:brightness(.9)}
.cta.ghost{background:var(--accent-tint); color:var(--accent)}
.cta svg{width:20px; height:20px}
.stale{font-size:13px; color:var(--label2); text-align:center; margin:-20px 0 28px}

/* ---------- segmented control / chips ---------- */
.seg{display:flex; background:var(--fill); border-radius:9px; padding:2px; margin:0 0 16px; position:relative}
.seg button{flex:1; font-size:13px; font-weight:500; padding:6px 4px; border-radius:7px; color:var(--label); letter-spacing:-.08px}
.seg button.on{background:var(--cell); box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04); font-weight:600}
:root[data-theme="dark"] .seg button.on{background:#636366}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .seg button.on{background:#636366} }
.chips{display:flex; gap:8px; margin:0 0 18px; overflow-x:auto; scrollbar-width:none}
.chips button{font-size:15px; padding:6px 14px; border-radius:16px; background:var(--fill); white-space:nowrap}
.chips button.on{background:var(--label); color:var(--bg); font-weight:600}

/* ---------- charts ---------- */
.card{background:var(--cell); border-radius:12px; padding:14px 16px 12px; margin:0 0 30px}
.card .gh{margin:0 0 4px}
.readout{display:flex; flex-wrap:wrap; gap:4px 14px; min-height:40px; align-items:flex-end; margin-bottom:8px}
.readout .when{width:100%; font-size:13px; color:var(--label2)}
.readout .s{font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:6px}
.readout .s i{width:8px; height:8px; border-radius:4px; display:inline-block}
.chart{position:relative; touch-action:pan-y; user-select:none; -webkit-user-select:none}
.chart svg{display:block; width:100%; overflow:visible}
.chart .yl{position:absolute; right:0; font-size:11px; background:var(--cell); border-radius:4px; padding:0 4px; color:var(--label3); transform:translateY(-100%); padding-bottom:1px; font-variant-numeric:tabular-nums; pointer-events:none}
.chart .xl{display:flex; justify-content:space-between; font-size:11px; color:var(--label3); margin-top:6px}
.chart .cursor{position:absolute; top:0; bottom:18px; width:1px; background:var(--label3); display:none; pointer-events:none}
.chart .dot{position:absolute; width:9px; height:9px; margin:-4.5px 0 0 -4.5px; border-radius:50%; border:2px solid var(--cell); display:none; pointer-events:none}
.chart.scrub .cursor,.chart.scrub .dot{display:block}
.pos{color:var(--green)}
.chart.bars .bplot{position:relative; margin-right:34px}
.chart.bars .bgrid{position:absolute; left:0; right:-34px; border-top:1px solid var(--sep); pointer-events:none}
.chart.bars .bgrid span{position:absolute; right:0; top:-8px; font-size:11px; color:var(--label3); font-variant-numeric:tabular-nums}
.chart.bars .bavg{position:absolute; left:0; right:0; border-top:1.5px dashed var(--label2); pointer-events:none; z-index:1}
.chart.bars .bcols{position:absolute; inset:0; display:flex; gap:2px}
.bcol{flex:1; min-width:0; height:100%; display:flex; align-items:flex-end; justify-content:center; gap:2px; border-radius:6px; position:relative; padding:0; background:none}
.bcol i{display:block; width:min(16px,38%); min-height:0; border-radius:4px 4px 0 0}
.bcol.part i{opacity:.4}
.bcol.on{background:var(--fill)}
.bcol .bx{position:absolute; top:100%; margin-top:5px; font-size:11px; color:var(--label3); white-space:nowrap}
.chart.bars{padding-bottom:20px}
.readout .s.sub{font-weight:400; color:var(--label2)}
.linkbtn{margin-left:auto; color:var(--accent); font-size:15px; padding:2px 0; background:none}
.spark{display:inline-flex; align-items:flex-end; gap:1px; height:18px; margin-right:10px; vertical-align:middle}
.spark i{flex:1; background:var(--label3); opacity:.55; border-radius:1px}
.private .spark{visibility:hidden}
.legend{display:flex; gap:14px; font-size:12px; color:var(--label2); margin-top:10px; flex-wrap:wrap}
.legend span{display:flex; align-items:center; gap:5px}
.legend i{width:14px; height:2px; border-radius:1px; display:inline-block}
.chips.small{margin-top:-8px}
.chips.small button{font-size:14px; padding:5px 12px}
.cnote{font-size:12px; color:var(--label2); margin:8px 0 0; line-height:1.35}
.dotc{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; flex:none; vertical-align:1px}
.hl{display:flex; align-items:center; font-size:14px; font-weight:600; margin:10px 0 5px}
.hl > span:last-child{margin-left:auto; font-weight:600; font-variant-numeric:tabular-nums}
.hl > .dotc + *{}
.ht{position:relative; height:16px; background:var(--fill); border-radius:4px}
.ht i{position:absolute; top:0; bottom:0; border-right:2px solid var(--cell)}
.ht i:first-of-type{border-radius:4px 0 0 4px}
.ht b{position:absolute; top:-4px; bottom:-4px; width:2px; margin-left:-1px; background:var(--label); z-index:1}
.whyp{margin-bottom:12px}
.dv{display:grid; grid-template-columns:minmax(0,1.1fr) 1.4fr auto; gap:8px; align-items:center; font-size:13px; color:var(--label2); margin:4px 0}
.dv > .amt{min-width:78px; text-align:right; color:var(--label); font-variant-numeric:tabular-nums}
.dt{position:relative; height:10px; background:var(--fill); border-radius:3px}
.dt b{position:absolute; left:50%; top:-3px; bottom:-3px; width:1px; background:var(--label3)}
.dt i{position:absolute; top:0; bottom:0; border-radius:3px}
.dt i.p{background:var(--c-sav)} .dt i.n{background:var(--c-debt)}
.score .sq-m{padding:8px 0; border-top:1px solid var(--sep)}
.score .sq-m:first-child{border-top:0}
.sq-l{font-size:14px; font-weight:600; margin-bottom:4px}
.sq-l span{font-weight:400; font-size:12px; color:var(--label3); margin-left:6px}
.sq-r{display:grid; grid-template-columns:auto 1fr 96px 34px; gap:6px; align-items:center; font-size:13px; margin:3px 0}
.sq-r .amt{text-align:right; font-variant-numeric:tabular-nums}
.sq-r.best .amt{font-weight:700}
.sq-r em{font-style:normal; font-size:11px; color:var(--green); font-weight:600}
.sq-t{height:8px; background:var(--fill); border-radius:3px; overflow:hidden}
.sq-t i{display:block; height:100%; border-radius:3px}
.tl{margin-bottom:6px}
.cells{display:flex; gap:1px; height:18px}
.cells i{flex:1; border-radius:2px; min-width:1px}
.cells i.lo, .tl-lo{background:var(--red)} .cells i.near, .tl-near{background:var(--orange)} .cells i.ok, .tl-ok{background:color-mix(in srgb,var(--c-sav) 35%,var(--fill))}
.yrs{position:relative; height:16px; font-size:11px; color:var(--label3); margin-top:2px}
.yrs span{position:absolute; transform:translateX(-50%)}
.track{position:relative; height:18px; background:var(--fill); border-radius:9px}
.track i{position:absolute; top:4px; width:10px; height:10px; margin-left:-5px; border-radius:50%; border:1.5px solid var(--cell)}
.track i.mk-m, i.sq.mk-m{border-radius:2px; transform:rotate(45deg)}
.mk-out{background:var(--c-debt)} .mk-in{background:var(--c-sav)} .mk-m{background:var(--c-isa)}
.mklist{display:flex; flex-wrap:wrap; gap:2px 12px; font-size:12px; color:var(--label2); margin-top:5px}
.mklist b{font-weight:600; color:var(--label)}
.private .hl .amt, .private .dv .amt, .private .sq-r .amt{filter:blur(8px)}
.legend i.sq{width:9px; height:9px; border-radius:2px}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important}

/* ---------- key stats grid ---------- */
.stats{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--sep); border-radius:12px; overflow:hidden; margin:0 0 30px}
.stats > div{background:var(--cell); padding:12px 14px}
.stats .k{font-size:13px; color:var(--label2)}
.stats .v{font-family:var(--round); font-size:22px; font-weight:600; margin-top:2px; font-variant-numeric:tabular-nums; letter-spacing:-.3px}
.stats .n{font-size:12px; color:var(--label2); margin-top:1px}
.badges{display:flex; flex-wrap:wrap; gap:4px; margin-top:4px}
.badge{font-size:11px; font-weight:600; padding:2px 6px; border-radius:5px; background:var(--fill); color:var(--label2)}
.badge.in{background:rgba(52,199,89,.15); color:var(--green)} .badge.out{background:rgba(255,59,48,.12); color:var(--red)} .badge.isa{background:var(--accent-tint); color:var(--accent)}

/* ---------- waterfall ---------- */
.wf .row .val{color:var(--label)}
.wf .total .ttl,.wf .total .val{font-weight:600}
.bar-mini{height:4px; border-radius:2px; background:var(--fill); margin-top:6px; overflow:hidden}
.bar-mini > i{display:block; height:100%; background:var(--accent); border-radius:2px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--bar); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); box-shadow:0 -.5px 0 var(--sep); padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); height:50px}
.tabbar button{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:10px; font-weight:500; color:var(--label2); letter-spacing:.1px}
.tabbar button svg{width:26px; height:24px}
.tabbar button.on{color:var(--accent)}

/* ---------- sheets ---------- */
.sheet-wrap{position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end; justify-content:center; background:rgba(0,0,0,0); transition:background .3s}
.sheet-wrap.open{background:rgba(0,0,0,.36)}
.sheet{width:100%; max-width:640px; max-height:calc(100% - env(safe-area-inset-top,0px) - 12px); background:var(--bg); border-radius:14px 14px 0 0; box-shadow:var(--shadow); display:flex; flex-direction:column; transform:translateY(100%); transition:transform .36s cubic-bezier(.2,.9,.25,1)}
.sheet-wrap.open .sheet{transform:none}
.sheet .grab{width:36px; height:5px; border-radius:3px; background:var(--label3); margin:6px auto 0}
.sheet .sh{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:6px 8px 8px}
.sheet .sh .t{font-weight:600; text-align:center}
.sheet .sh button{color:var(--accent); padding:8px}
.sheet .sh .done{justify-self:end; font-weight:600}
.sheet .sh .cancel{justify-self:start}
.sheet .sb{overflow-y:auto; padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px)); -webkit-overflow-scrolling:touch}
.field{display:flex; align-items:center; gap:10px; min-height:44px; padding:0 16px; position:relative}
.field + .field::before{content:""; position:absolute; top:0; right:0; left:16px; height:.5px; background:var(--sep)}
.field label{flex:1; min-width:0}
.field label .sub{display:block; font-size:12px; color:var(--label2); margin-top:1px}
.field input[type=text],.field input[type=date],.field select{border:0; background:transparent; text-align:right; color:var(--label2); padding:11px 0; min-width:0; width:52%; outline:none; font-variant-numeric:tabular-nums; -webkit-appearance:none; appearance:none}
.field input[type=text]:focus{color:var(--label)}
.field input.wide{width:62%}
.field select{direction:rtl; color:var(--accent)}
.field input[type=month]{border:0; background:transparent; text-align:right; color:var(--label2); padding:11px 0; min-width:0; width:52%; outline:none; -webkit-appearance:none; appearance:none; font:inherit}
/* a choice with long options (accounts): the question on its own line, the answer full width underneath */
.field.stack{flex-direction:column; align-items:stretch; gap:0; padding-top:10px}
.field.stack select{width:100%; direction:ltr; text-align:left; padding:4px 0 12px; font-weight:500}
.field .unit{color:var(--label2); margin-left:-6px}
.switch{position:relative; width:51px; height:31px; flex:none; touch-action:manipulation}
/* The checkbox is the thing tapped, so it must cover the drawn switch and then some. inset alone does not stretch
   a checkbox in Safari (it keeps its ~13px native size in the corner, and most taps landed on nothing), so it gets
   an explicit size, no native appearance, and 8-10px of slack all round for a finger that is a little off. */
.switch input{position:absolute; z-index:1; left:-10px; top:-8px; width:calc(100% + 20px); height:calc(100% + 16px); margin:0; opacity:0; -webkit-appearance:none; appearance:none; cursor:pointer; -webkit-tap-highlight-color:transparent}
.row.swrow{cursor:pointer; -webkit-tap-highlight-color:transparent}
.row.swrow:active{background:var(--cell-hi)}
button, .row, .chips button, .seg button{touch-action:manipulation}
.switch span{pointer-events:none; position:absolute; inset:0; border-radius:16px; background:var(--fill2); transition:background .2s}
.switch span::after{content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06); transition:transform .22s}
.switch input:checked + span{background:#34C759}
.switch input:checked + span::after{transform:translateX(20px)}
.tick{position:relative; width:24px; height:24px; flex:none}
.tick input{position:absolute; opacity:0; width:44px; height:44px; left:-10px; top:-10px; margin:0; cursor:pointer}
.tick span{pointer-events:none; position:absolute; inset:0; border-radius:50%; border:1.5px solid var(--label3); transition:background .15s,border-color .15s}
.tick input:checked + span{background:var(--accent); border-color:var(--accent)}
.tick input:checked + span::after{content:""; position:absolute; left:8px; top:4px; width:5px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg)}
.tick input:focus-visible + span{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.field.out label, .field.out .amtin{opacity:.4}
.amtin{display:flex; align-items:baseline; gap:2px; color:var(--label2); font-family:var(--round); flex:none}
.field .amtin input.bal-in{width:6.8em; border:0; background:var(--fill); border-radius:8px; padding:7px 10px; margin:6px 0; text-align:right; font-family:var(--round); font-size:17px; color:var(--label); outline:none}
.field .amtin input.bal-in:focus{box-shadow:0 0 0 2px var(--accent)}
.delta{font-variant-numeric:tabular-nums}
.note{font-size:13px; color:var(--label2); line-height:1.4; margin:0 4px 20px}
textarea{width:100%; min-height:160px; border-radius:12px; border:0; padding:12px; background:var(--cell); color:var(--label); font:13px/1.4 ui-monospace,Menlo,monospace}

/* ---------- toast ---------- */
.toast{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 10px); transform:translate(-50%,-200%); visibility:hidden; z-index:60; background:var(--cell); color:var(--label); box-shadow:var(--shadow); padding:10px 16px; border-radius:22px; font-size:15px; font-weight:600; transition:transform .35s cubic-bezier(.2,.9,.25,1), visibility .35s; display:flex; gap:8px; align-items:center; max-width:92vw}
.toast.show{transform:translate(-50%,0); visibility:visible}
.toast svg{width:18px; height:18px; color:var(--green)}

/* ---------- welcome ---------- */
.welcome{min-height:80vh; display:flex; flex-direction:column; justify-content:center; padding:40px 8px}
.welcome .mark{width:64px; height:64px; border-radius:15px; background:var(--accent); display:grid; place-items:center; margin-bottom:22px}
.welcome .mark svg{width:38px; height:38px; color:#fff}
.welcome h2{font-size:34px; line-height:1.1; margin:0 0 12px; letter-spacing:.2px}
.welcome p{color:var(--label2); margin:0 0 28px; max-width:30em}
.welcome .cta{margin-bottom:12px}

.private .amt, .private .readout .s, .private .yl, .private .hero .big, .private .chart.bars .bgrid span, .private .hero .eq{filter:blur(9px); transition:filter .2s}
/* ---- tools strip and plan cards: a screen's options at its top ---- */
.tools{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(136px,1fr); scroll-padding-inline:16px; gap:10px; overflow-x:auto; scrollbar-width:none; margin:0 -16px 22px; padding:2px 16px 4px; scroll-snap-type:x proximity}
.tools::-webkit-scrollbar, .plancards::-webkit-scrollbar{display:none}
.tool{background:var(--cell); border-radius:14px; padding:12px 12px 11px; text-align:left; display:flex; flex-direction:column; gap:2px; min-height:96px; scroll-snap-align:start; box-shadow:0 1px 0 rgba(0,0,0,.02); transition:transform .15s}
.tool .tic{width:30px; height:30px; border-radius:9px; background:color-mix(in srgb,var(--accent) 14%,transparent); color:var(--accent); display:grid; place-items:center; margin-bottom:6px}
.tool .tic svg{width:18px; height:18px}
.tool .tt{font-weight:600; font-size:14px; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.tool .ts{font-size:12px; color:var(--label2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tool:active, .plancard:active, .cta:active, .tapcard:active{transform:scale(.97)}
.plancards{scroll-padding-inline:16px; display:grid; grid-auto-flow:column; grid-auto-columns:minmax(170px,62%); gap:10px; overflow-x:auto; scrollbar-width:none; margin:0 -16px 24px; padding:2px 16px 4px; scroll-snap-type:x proximity}
.plancard{background:var(--cell); border-radius:14px; padding:13px 14px; text-align:left; display:flex; flex-direction:column; gap:5px; scroll-snap-align:start; border:1.5px solid transparent; transition:transform .15s}
.plancard.def{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.plancard.add{background:transparent; border:1.5px dashed var(--sep)}
.plancard .pn{font-weight:600; font-size:15px; display:flex; align-items:center; gap:6px}
.plancard .ps{font-size:12px; color:var(--label2); line-height:1.35; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
/* ---- ISA allowance ---- */
.rings{display:flex; justify-content:center; gap:22px; margin:-6px 0 18px; flex-wrap:wrap}
.ring{position:relative; display:flex; flex-direction:column; align-items:center; gap:2px}
.ring-t{position:absolute; top:0; height:92px; display:grid; place-items:center; width:92px; font-size:19px; font-family:var(--round)}
.ring-n{font-weight:600; font-size:14px; margin-top:4px}
.ring-v{font-size:12px; color:var(--label2)}
.okchip{background:rgba(52,199,89,.12); color:var(--green); border-radius:12px; padding:11px 14px; margin:0 0 20px; font-size:14px}
.okchip b{color:var(--green)}
.ybars{display:flex; gap:6px; align-items:flex-end; height:170px; padding-top:6px}
.ybars.thin{gap:2px; height:150px}
.ycol{flex:1; min-width:0; height:100%; display:flex; flex-direction:column; align-items:stretch; justify-content:flex-end}
.ystack{flex:1 1 auto; display:flex; flex-direction:column; border-radius:6px 6px 2px 2px; overflow:hidden; max-height:calc(100% - 34px)}
.ybars.thin .ystack{flex:none; max-height:calc(100% - 18px); border-radius:3px 3px 1px 1px}
.ystack i{display:block; width:100%}
.y-bf{background:var(--c-isa)} .y-pl{background:color-mix(in srgb,var(--c-isa) 45%,var(--cell))}
.y-un, i.sq.y-un{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--red) 22%,transparent) 0 4px,transparent 4px 8px); box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--red) 55%,transparent)}
.ycol .yl{font-size:11px; color:var(--label3); text-align:center; margin-top:5px; white-space:nowrap}
.ycol .yv{font-size:11px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.m-pri, i.sq.m-pri{background:var(--c-sav)} .m-int, i.sq.m-int{background:var(--c-debt); opacity:.8}
.mchart .mplot{position:relative; height:150px; margin-top:22px}
.mplot svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.mbars{position:absolute; inset:0; display:flex; gap:3px; align-items:flex-end}
.mcol{flex:1; height:100%; display:flex; align-items:flex-end}
.mcol i{display:block; width:100%; background:var(--c-isa); opacity:.35; border-radius:3px 3px 0 0}
.aline{position:absolute; left:0; right:0; border-top:1.5px dashed var(--orange); z-index:1}
.aline span{position:absolute; right:0; top:-17px; font-size:11px; color:var(--orange); background:var(--cell); padding:0 4px; border-radius:4px}
.mchart .xl{display:flex; justify-content:space-between; font-size:11px; color:var(--label3); margin-top:6px}
.tapcard{cursor:pointer; transition:transform .15s}
.abar{display:flex; height:12px; border-radius:6px; background:var(--fill); overflow:hidden; margin:8px 0 7px}
.abar i{display:block; height:100%}
.a-bf{background:var(--c-isa)} .a-pl{background:color-mix(in srgb,var(--c-isa) 45%,var(--cell))}
.arow{display:flex; justify-content:space-between; gap:10px; font-size:13px; color:var(--label2)}
.split{display:inline-flex; width:84px; height:8px; border-radius:4px; overflow:hidden; background:var(--fill); vertical-align:middle}
.split i{display:block; height:100%}
.s-int{background:var(--c-debt); opacity:.8} .s-pri{background:var(--c-sav)}
.private .ring-t, .private .ring-v, .private .arow .amt, .private .ycol .yv .amt{filter:blur(8px)}

/* ---- motion: only when arriving on a screen (#main.fx), never on the redraw after a save ---- */
@keyframes rise{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:none}}
@keyframes pop{0%{opacity:0; transform:scale(.9) translateY(8px)}70%{transform:scale(1.02)}100%{opacity:1; transform:none}}
@keyframes ringIn{from{stroke-dasharray:0 var(--c)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 0%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--red) 14%,transparent)}}
.fx .page > section, .fx .page > .stats, .fx .page > .warnchip, .fx .page > .okchip, .fx .page > .hero{animation:rise .5s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i,0) * 55ms)}
.fx .tool, .fx .plancard{animation:pop .45s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i,0) * 45ms + 60ms)}
.fx .chart svg, .fx .mplot svg{animation:reveal 1.1s cubic-bezier(.3,.7,.2,1) both .15s}
.fx .bcol i, .fx .ystack, .fx .mcol i, .fx .cells i{transform-origin:bottom; animation:growY .7s cubic-bezier(.2,.8,.2,1) both}
.fx .ycol:nth-child(2) .ystack, .fx .bcol:nth-child(2) i{animation-delay:.05s} .fx .ycol:nth-child(3) .ystack, .fx .bcol:nth-child(3) i{animation-delay:.1s}
.fx .ycol:nth-child(4) .ystack, .fx .bcol:nth-child(4) i{animation-delay:.15s} .fx .ycol:nth-child(5) .ystack, .fx .bcol:nth-child(5) i{animation-delay:.2s}
.fx .ycol:nth-child(n+6) .ystack, .fx .bcol:nth-child(n+6) i{animation-delay:.25s}
.fx .bar2 i, .fx .ht i, .fx .sq-t i, .fx .abar, .fx .split{transform-origin:left; animation:growX .8s cubic-bezier(.2,.8,.2,1) both .1s}
.fx .dt i.p{transform-origin:left; animation:growX .7s cubic-bezier(.2,.8,.2,1) both .15s}
.fx .dt i.n{transform-origin:right; animation:growX .7s cubic-bezier(.2,.8,.2,1) both .15s}
.fx .ring-arc{animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1) both .2s}
.fx .track i{animation:pop .5s cubic-bezier(.2,.8,.2,1) both .3s}
.warnchip{animation:glow 2.4s ease-in-out 1s 2}
#tabbar button:active svg{transform:scale(.86); transition:transform .1s}
#tabbar button svg{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
#tabbar button.on svg{animation:pop .35s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.open .sheet .group{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.switch span::after{transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
/* swipe back: the page follows the finger over the one it goes back to */
#main{position:relative}
.swipe-under{position:absolute; left:0; right:0; z-index:0; pointer-events:none; overflow:hidden; height:100vh; transform:translateX(-30%); opacity:.6}
.swiping #main > .page{position:relative; z-index:1; background:var(--bg); box-shadow:-10px 0 28px rgba(0,0,0,.14); will-change:transform}
.swiping{overflow-x:hidden}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
@media (min-width:700px){ .page{padding-top:12px} }
</style>
</head>

  <button data-act="tab" data-arg="accounts"><svg viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="4" width="20" height="16" rx="3.5"/><path d="M3 9h20M7 15h5"/></svg>Accounts</button>

  <button data-act="tab" data-arg="plan"><svg viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h10M19 6h3M4 12h3M12 12h10M4 18h12M21 18h1"/><circle cx="16.5" cy="6" r="2.3"/><circle cx="9.5" cy="12" r="2.3"/><circle cx="18.5" cy="18" r="2.3"/></svg>Plan</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
